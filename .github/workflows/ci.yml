name: CI

on:
  push:
    branches: [main, master, crawler-verified-2026-07-29, 'feature/**', 'chore/**']
  pull_request:
    branches: [main, master, crawler-verified-2026-07-29, 'feature/**', 'chore/**']

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    # ruff 门禁：与本地 pre-commit 同一套配置（pyproject.toml [tool.ruff]）
    # Tier-1 目录（viz/tools/backend/tests/common/scripts/workspace）零豁免，
    # Tier-2 按白名单豁免存量债 —— 新增规则对 Tier-2 同样生效。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install --upgrade pip && pip install ruff==0.17.4

      - name: Ruff check
        run: ruff check --output-format=github .

  quality-gate:
    # 仓库自检门禁（35 项）：星图 wrapper 唯一性 / viz 内核可导入 / 报告体积 /
    # DB helper 收敛 / 收敛入口连通 / 色板单一来源… 只在主干跑：
    # 它依赖本机数据源与归档，部分项在 PR 环境不具备条件。
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run repository quality gate
        run: python3 tools/verify_quality_gate.py

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nba
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_NAME: nba
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          # libpq 标准变量名：测试里直接 psycopg2.connect(..., password=...)
          # 读的是 PGPASSWORD；conftest 会从 DB_PASSWORD 派生，此处显式给出，
          # 两者等值且都只来自 secret，不硬编码。
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          python -m pytest tests/ -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nbacore-studio:latest .

      - name: Verify image starts
        run: |
          docker run -d --name nbacore-test -p 5577:5577 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5433 \
            nbacore-studio:latest
          sleep 5
          curl -sf http://localhost:5577/health || exit 1
          docker stop nbacore-test

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate viz theme tokens
        # theme_tokens.json 是 viz/base.py 的生成物且未纳入版本控制，
        # 每次 CI 现生成，避免第 7 条契约断言被 t.skip 静默跳过；
        # 也能捕获「改了 theme.py 色板却没同步测试预期」的回归。
        run: python3 viz/base.py

      - name: Run frontend contract tests
        run: node --test frontend/tests/*.test.js

      - name: report-size-gate
        # 显式限定只扫描仓库根与 frontend/（脚本非递归），不依赖脚本默认值：
        # reports/_pre_strip_backup/ 内存放 7 份剥离前原始 HTML（4.66~4.93 MB），
        # 是刻意的例外，勿将其加入 dirs、勿改成递归 / 全仓扫描，否则硬门禁会被打爆。
        run: python3 tools/check_report_size.py --max-mb 2 "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/frontend"
