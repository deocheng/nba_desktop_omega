name: CI

on:
  push:
    branches: [main, master, crawler-verified-2026-07-29, 'feature/**', 'chore/**']
  pull_request:
    branches: [main, master, crawler-verified-2026-07-29, 'feature/**', 'chore/**']

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    # ruff 门禁：与本地 pre-commit 同一套配置（pyproject.toml [tool.ruff]）
    # Tier-1 目录（viz/tools/backend/tests/common/scripts/workspace）零豁免，
    # Tier-2 按白名单豁免存量债 —— 新增规则对 Tier-2 同样生效。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install --upgrade pip && pip install ruff==0.17.4

      - name: Ruff check
        run: ruff check --output-format=github .

  quality-gate:
    # 仓库自检门禁（35 项）：星图 wrapper 唯一性 / viz 内核可导入 / 报告体积 /
    # DB helper 收敛 / 收敛入口连通 / 色板单一来源… 只在主干跑：
    # 它依赖本机数据源与归档，部分项在 PR 环境不具备条件。
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run repository quality gate
        run: python3 tools/verify_quality_gate.py

  test:
    runs-on: ubuntu-latest

    # ⚠️ 本 job **提供 postgres 服务，但只还原结构、不灌数据**（2026-11-10 实测定稿）。
    #
    # 三档实测对照（同一套 781 个用例）：
    #   | 场景                            | passed | skipped | failed | error |
    #   |---------------------------------|--------|---------|--------|-------|
    #   | 不提供 postgres（不可达）         |   620 |     161 |      0 |     0 |
    #   | 提供 postgres 但空库（无 schema） |   654 |      25 |     89 |    13 |
    #   | 提供 postgres + schema-only      |   686 |      36 |     59 |     0 |
    #
    # 采用第三档的理由：
    #   1) **结构契约类测试值得真跑**。DDL、列类型、约束、视图、路由契约这类
    #      断言只需要「库结构在」，不需要「库里有数据」——把它们和内容断言
    #      一起 skip 等于白扔覆盖；
    #   2) **schema-only 几乎不花钱**：psql -f db/schema.sql 实测 0.3s，
    #      197 个对象，与生产库 information_schema.tables 计数完全一致；
    #   3) **内容断言类测试统一 skip**（needs_data marker）。`ping()` 只跑
    #      SELECT 1，空库也能通过 → 若只判「可连」，数据依赖测试会在空库上
    #      「真跑并失败」，把「环境缺数据」误报成「代码有 bug」（第二档 102 red）。
    #
    # 🔴 CI 绿**只代表「不依赖生产数据」的部分**。数据内容层回归仍需对着真库跑
    #    （本地真实库；后续可加 nightly job）。
    #
    # DB_PORT 仍设为 5433（v7 约定，tests/test_phase0_health.py 会断言该值），
    # 因此 service 也要映射到 5433 而不是 postgres 默认的 5432。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nba
          POSTGRES_USER: postgres
          # trust 认证：CI 的一次性容器不需要口令，DB_PASSWORD/PGPASSWORD 留空
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d nba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure psql client is available
        run: |
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          }

      - name: Restore schema (structure only, no data)
        # db/schema.sql = 生产库的完整 DDL（仅结构）。ON_ERROR_STOP=1 保证
        # 「schema 还原失败」直接让本 job 变红，而不是留下一堆看不懂的 ERROR。
        #
        # 🔴 重试 + 显式 127.0.0.1 的原因（2026-11-10 实测踩坑）：
        #   postgres 官方镜像在 initdb 阶段会先起一个**只监听 unix socket** 的临时
        #   实例；health check 若用默认 host（socket）判定就绪，GitHub 会提前放行，
        #   而 psql 走的是 TCP → 命中「server closed the connection unexpectedly」。
        #   → health check 与 psql 统一走 127.0.0.1（TCP），并加重试兜底。
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if psql -h 127.0.0.1 -p 5433 -U postgres -d nba -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            echo "postgres 尚未就绪（第 $i 次重试）…"
            sleep 3
          done
          psql -h 127.0.0.1 -p 5433 -U postgres -d nba \
               -v ON_ERROR_STOP=1 -q -o /dev/null -f db/schema.sql

      - name: Verify schema restored
        run: |
          test "$(psql -h 127.0.0.1 -p 5433 -U postgres -d nba -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")" -ge 190 \
            || { echo "schema 还原不完整"; exit 1; }

      - name: Run tests
        env:
          # 用 127.0.0.1 而非 localhost：避免 ::1/IPv6 解析歧义
          # （首次 push 就是在 "localhost (::1)" 上撞到容器未就绪）。
          DB_HOST: 127.0.0.1
          DB_PORT: "5433"
          DB_NAME: nba
          DB_USER: postgres
          # 一次性容器用 trust 认证，无口令可注；留空而非硬编码。
          DB_PASSWORD: ""
          PGPASSWORD: ""
        run: |
          python -m pytest tests/ -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nbacore-studio:latest .

      - name: Verify image starts
        run: |
          docker run -d --name nbacore-test -p 5577:5577 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5433 \
            nbacore-studio:latest
          sleep 5
          curl -sf http://localhost:5577/health || exit 1
          docker stop nbacore-test

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate viz theme tokens
        # theme_tokens.json 是 viz/base.py 的生成物且未纳入版本控制，
        # 每次 CI 现生成，避免第 7 条契约断言被 t.skip 静默跳过；
        # 也能捕获「改了 theme.py 色板却没同步测试预期」的回归。
        run: python3 viz/base.py

      - name: Run frontend contract tests
        run: node --test frontend/tests/*.test.js

      - name: report-size-gate
        # 显式限定只扫描仓库根与 frontend/（脚本非递归），不依赖脚本默认值：
        # reports/_pre_strip_backup/ 内存放 7 份剥离前原始 HTML（4.66~4.93 MB），
        # 是刻意的例外，勿将其加入 dirs、勿改成递归 / 全仓扫描，否则硬门禁会被打爆。
        run: python3 tools/check_report_size.py --max-mb 2 "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/frontend"
