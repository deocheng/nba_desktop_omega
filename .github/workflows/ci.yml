name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nba
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_NAME: nba
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python -m pytest tests/ -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nbacore-studio:latest .

      - name: Verify image starts
        run: |
          docker run -d --name nbacore-test -p 5577:5577 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5433 \
            nbacore-studio:latest
          sleep 5
          curl -sf http://localhost:5577/health || exit 1
          docker stop nbacore-test
