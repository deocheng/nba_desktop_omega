# NBA 本地语音识别字幕工具 · 配置
# 路径均为相对本配置文件所在目录；也可用绝对路径。

models:
  # 识别后端：fasterwhisper（默认，有 3.13 预编译 wheel，Apple Silicon 很快）或
  # whispercpp（whisper.cpp/whisper-cpp-python，Metal 加速、速度最快，但需本机编译）。
  backend: fasterwhisper
  # Whisper 模型：已手动下载到本地（见 models/README.md），填绝对路径。
  # 英法夹杂场景建议 medium 起步；追求质量可换 large-v3。
  whisper: /Volumes/12T/NBA/nba_subtitle_tool/models/faster-whisper-medium
  # 翻译用本地大模型（Ollama 标签）。篮球专业翻译推荐 qwen2.5:14b；追求速度用 qwen2.5:7b。
  # 注意：源语言为中文的视频会跳过翻译步骤，此模型不会被调用。
  translator: qwen2.5:7b

paths:
  work_dir: ./work          # 中间产物：音频分块、原始识别 json
  output_dir: ./output      # 最终产物：SRT 字幕 + Markdown 文稿

audio:
  sample_rate: 16000
  channels: 1
  # 长视频分块（秒）。5 小时视频按 10 分钟一块切，避免内存爆炸、支持断点续跑。
  chunk_seconds: 600
  chunk_overlap_seconds: 20   # 块间重叠，避免切在句子中间丢失上下文

subtitle:
  max_chars_per_line: 22      # 一行中文字数上限（超出自动换行）
  max_line_duration: 7.0      # 单条字幕最长时间（秒），超出则按字符拆分
  max_lines: 2                # 单条字幕最多行数

translation:
  glossary_path: glossary.json
  target_language: zh-CN
  # 源语言为中文时，是否把繁体统一转简体（simplified=转简体；keep=保持原样）。
  # 仅对检测到的中文源生效，英文/法文走翻译不受影响。
  target_chinese: simplified
  workers: 4                  # 并发翻译线程数（段落级，1:1 映射最稳）
  # 每次翻译前注入术语表的最大条目数（0=全量）。术语表很长时限制注入量更稳。
  glossary_inject_limit: 0
  # 模型温度。翻译要稳定，设低。
  temperature: 0.1
  # 请求本地 Ollama 的地址
  ollama_base_url: http://localhost:11434

pipeline:
  # 自动语言检测：开启后 Whisper 逐段判断英/法，处理视频中夹杂的法语。
  auto_language: true
  # 断点续跑：已完成的块/翻译缓存会跳过。
  resume: true
