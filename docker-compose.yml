version: '3.8'
services:
  node-media-server:
    image: node-media-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1935:1935"   # RTMP
      - "8000:8000"   # HTTP FLV
      - "8443:8443"   # HTTPS FLV
    volumes:
      - ./config:/app/config   # optional custom configuration
    restart: unless-stopped
