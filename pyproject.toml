[project]
name = "nbacore-studio"
version = "8.0.0"
description = "NBACore Studio v8 — Metric-Driven Batch Analytics Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "diskcache>=5.6",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
# 打包成本地 app（PyInstaller one-file）。生产依赖里不含它，避免拖累部署体积。
# 构建入口：bash scripts/build_app.sh ；详见 docs/app-build.md
build = ["pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --basetemp 固定到仓库内：系统 TMPDIR 下的 pytest-of-<user> 目录可能由
# 其他用户创建且不可写，导致 tmp_path fixture 集体 FileExistsError
# （实测沙箱环境下 60+ 用例因此报错，与业务逻辑无关）。
addopts = "-v --tb=short --basetemp=.pytest_tmp"
markers = [
    "phase0: Phase 0 Environment Bootstrap tests",
    "needs_db: requires live PostgreSQL connection",
]

[tool.setuptools]
packages = ["backend"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff — 统一 lint 门禁（2026-11-10）
#
# 分层策略：**Tier-1 严格零豁免**（新增代码必须干净），**Tier-2 白名单豁免**
# （存量债显式列出，每还一处就删一条豁免）。豁免用「规则白名单」而非
# "ALL"，因此未来新增的规则对 Tier-2 仍然生效 —— 豁免不会悄悄扩大。
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120          # 320→120 后 E501 从 3108 降到 637
extend-exclude = [
    ".venv", "node_modules", "raw_archive", "backups", "research",
    ".pytest_cache", ".pytest_tmp", "__pycache__", ".git",
    "external_crawler/crawler/legacy",   # 归档死代码（零调用方）
    "reconcile_2026-07-10", "reconcile_2026-07-11",   # 历史对账快照
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    # import 不在文件顶部：爬虫/工具脚本 sys.path 注入后的既定模式
    # （注入必须先于 import，否则找不到本地模块），全仓豁免。
    "E402",
    # raise 不带 from：存量 119 处，属异常链风格债而非缺陷，
    # 改写面广、回归风险高于收益，留待专项治理。
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# 包入口的 re-export：ruff 会把 `from . import theme, svg, base` 判为未使用
# 并删除 —— 那会直接打断 `import viz; viz.theme.compat_vars` 这类用法。
# （实测已踩：autofix 误删 7 个 __init__.py 的 re-export，已回滚。）
"**/__init__.py" = ["F401", "F403"]

# ── Tier-2 白名单：外部爬虫 / 一次性脚本 / 子项目（存量债，逐条收紧）────
# 说明：TOML 不支持变量引用，故列表逐条展开（改一处需改 N 处，
#       故把内容集中在此处并保持各键完全一致）。
# E501 长行 / E401,E701,E702 单行多语句 / W291,W293 空白
# F401 未用 import / F841 未用变量 / E722 bare except / E741 歧义变量名
# B007,B006,B008,B011,B017,B018,B023,B033,B905 / E731 lambda 赋值
"external_crawler/**" = ["E501", "E401", "E701", "E702", "W291", "W293", "F401", "F841", "E722", "E741", "B007", "B006", "B008", "B011", "B017", "B018", "B023", "B033", "B905", "E731"]
